name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find ZIP and Android project root
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          zips=( ./*.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::Repozitoriy ildizida .zip fayl topilmadi. Loyiha zipini yuklang."
            ls -la
            exit 1
          fi
          echo "Topilgan ZIP fayllar:"
          printf ' - %s\n' "${zips[@]}"
          [ ${#zips[@]} -gt 1 ] && echo "::warning::Bir nechta ZIP bor. Eng oxirgi yuklangani olinadi. Eskilarini o'chirib qo'ying."
          best=""; bt=-1
          for z in "${zips[@]}"; do
            t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || true)
            t=${t:-0}
            if [ "$t" -ge "$bt" ]; then bt=$t; best="$z"; fi
          done
          echo "Tanlandi: $best"
          rm -rf project out
          mkdir -p project out
          unzip -q "$best" -d project
          SETTINGS=$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -not -path '*/__MACOSX/*' -not -path '*/build/*' -print | awk -F/ '{print NF" "$0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$SETTINGS" ]; then
            echo "::error::ZIP ichida settings.gradle topilmadi. Zip ichidagi fayllar:"
            find project -maxdepth 3 | head -60
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "Android loyiha ildizi: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build release APK (3 tries on network errors)
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          set +e
          rc=1
          for n in 1 2 3; do
            echo "::group::Urinish $n/3"
            gradle assembleRelease --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ $rc -eq 0 ] && break
            if [ $n -lt 3 ] && grep -qiE 'status code 429|Too Many Requests|Could not (resolve|GET|HEAD)|timed out|Connection (reset|refused)|UnknownHost|status code 5[0-9][0-9]|Premature end' "$RUNNER_TEMP/build.log"; then
              echo "::warning::Vaqtinchalik tarmoq xatosi. 60 soniyadan keyin qayta uriniladi."
              sleep 60
            else
              break
            fi
          done
          if [ $rc -ne 0 ]; then
            echo "::error::Build muvaffaqiyatsiz (kod $rc). Jurnaldan 'What went wrong' yoki 'error:' qatorini qidiring."
            exit $rc
          fi

      - name: Collect APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_ROOT" -type f -name '*.apk' -path '*/outputs/apk/release/*' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Build tugadi, lekin release APK topilmadi. Mavjud fayllar:"
            find "$PROJECT_ROOT" -name '*.apk' -o -name 'outputs' | head -30
            exit 1
          fi
          echo "APK topildi: $APK"
          case "$APK" in *unsigned*) echo "::warning::APK imzosiz. Telefonga o'rnatilmasligi mumkin (imzo sozlamasini tekshiring).";; esac
          cp "$APK" out/app-release.apk
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gano-Signal-APK
          path: out/app-release.apk
          if-no-files-found: error
