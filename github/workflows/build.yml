name: Build GANO SIGNAL APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP and locate settings
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "ZIP fayl topilmadi"
            ls -la
            exit 1
          fi

          for zipfile in "${zips[@]}"; do
            echo "Ochilyapti: $zipfile"
            mkdir -p extracted
            unzip -oq "$zipfile" -d extracted
          done

          settings=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$settings" ]; then
            echo "settings.gradle topilmadi"
            find . -type f | sort
            exit 1
          fi

          project_dir=$(dirname "$settings")
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Loyiha topildi: $project_dir"

      - name: Build Release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          for attempt in 1 2 3; do
            echo "Build urinish: $attempt/3"
            if gradle assembleRelease --no-daemon; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build xatosi. Qayta urinilmoqda..."
              sleep 20
            fi
          done

          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gano-Signal-APK
          path: '**/app-release.apk'
          if-no-files-found: error
